name: Verification
on: [push, pull_request]
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generer trois postes
        shell: powershell
        run: .\Generer_Postes.ps1 -NombrePostes 3
      - name: Verifier JavaScript
        shell: powershell
        run: |
          Get-ChildItem .\POSTES_GENERES -Recurse -Filter jeu.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript invalide" }
          }

